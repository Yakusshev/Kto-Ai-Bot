# Проверки кода: тесты, lint-imports, ruff, тесты архитектуры, mypy, сборка Docker-образа без пуша.
#
# Запуск:
#   - на каждый PR;
#   - на push в рабочие ветки (не main и не sprint*);
#   - из deploy.yml (workflow_call). Для main и sprint* CI запускает
#     deploy.yml перед выкладкой на test, поэтому здесь эти ветки
#     исключены, чтобы проверки не шли дважды на один и тот же push.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - "sprint*"
  workflow_call:
    inputs:
      ref:
        description: Коммит для проверки (deploy.yml передаёт выкладываемый sha)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11" # как в Dockerfile (python:3.11-slim)
  RUFF_VERSION: "0.17.3" # как в requirements-dev.txt

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Установить зависимости
        run: pip install --disable-pip-version-check -r requirements.txt
      # Корневой test_ai.py — ручной скрипт с сетевыми вызовами, в CI его не собираем.
      # env_const валидирует окружение при импорте: даём фиктивные значения,
      # в сеть тесты не ходят, секреты не нужны.
      - name: pytest test
        env:
          DEBUG_MODE_TOKEN: "True"
          BOT_TOKEN: "0:ci-dummy"
          BOT_TOKEN_ADMIN: "0:ci-dummy"
          YDB_ENDPOINT: "grpcs://localhost:2135"
          YDB_PATH: "/ci/dummy"
          NEXT_MESSAGE_SEPARATOR: "|||"
          ADMIN_ID_LIST: "1"
          OWN_CHANNEL_ID: "1"
          OWN_CHAT_ID: "1"
        run: python -m pytest test -q --ignore=test/architecture # архитектура - отдельным джобом

  # Ограждения архитектуры (S0): каждый джоб обязательный, ставит только нужное из requirements-dev.txt.
  lint-imports:
    name: lint-imports
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установить зависимости
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      # Контракты слоёв из .importlinter (baseline нарушений - там же, только сокращать)
      - name: lint-imports
        run: lint-imports

  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Только ruff check (правила в pyproject.toml). ruff format не запускаем:
      # он ломает стиль «каждый параметр на отдельной строке».
      - name: Установить ruff
        run: pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"
      - name: ruff check
        run: ruff check .

  architecture:
    name: тесты архитектуры
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Тесты в test/architecture читают только файлы, зависимости проекта не нужны
      - name: Установить pytest
        run: pip install --disable-pip-version-check pytest
      - name: pytest test/architecture
        run: python -m pytest test/architecture -q

  mypy:
    name: mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Установить зависимости
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      # Весь проект целиком, конфиг и baseline по модулям - в mypy.ini
      - name: mypy
        run: mypy

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - name: Собрать образ (без пуша)
        run: docker build -t kto-ai-bot:ci .
      - name: Образ стартует и импортирует зависимости
        run: docker run --rm --entrypoint python kto-ai-bot:ci -c "import aiogram, ydb, openai, aiogram_i18n"
