# Запуск: mypy   (см. CLAUDE.md)
# До ослаблений на всём проекте было 13 ошибок в 7 файлах (с ignore_missing_imports,
# как в прежнем CI); без ignore_missing_imports - 67 из-за пакетов без стабов.
[mypy]
files = bot, main.py, test
explicit_package_bases = True
ignore_missing_imports = True

# BASELINE: накопленные ошибки отключены по коду ошибки в конкретных модулях.
# Только сокращать: исправили - удалите секцию. Новые файлы проверяются полностью.

[mypy-bot.feature.admin.entrypoint.filter.IsRemindCommand]
disable_error_code = name-defined

[mypy-bot.feature.business.data.datasource.UserRemoteDataSource]
disable_error_code = arg-type, assignment

[mypy-bot.feature.business.data.repository.ChatHistoryRepositoryImpl]
disable_error_code = arg-type

[mypy-bot.feature.business.domain.model.UserModel]
disable_error_code = return-value

[mypy-bot.feature.business.domain.usecase.GetInactiveChatListUseCase]
disable_error_code = operator

[mypy-bot.feature.business.entrypoint.SaveMessageModelMapper]
disable_error_code = arg-type, call-arg

[mypy-bot.feature.business.entrypoint.service.ReminderService]
disable_error_code = arg-type, union-attr
