# Запуск: mypy   (см. CLAUDE.md)
# Эталон - python 3.11 и версии из requirements.txt (как в CI): ошибки зависят от версий.
# До ослаблений там было 32 ошибки в 10 файлах (на python 3.13 с другими версиями пакетов - 13 в 7).
[mypy]
files = bot, main.py, test
explicit_package_bases = True
ignore_missing_imports = True

# BASELINE: накопленные ошибки отключены по коду ошибки в конкретных модулях.
# Только сокращать: исправили - удалите секцию. Новые файлы проверяются полностью.

[mypy-bot.feature.admin.entrypoint.filter.IsRemindCommand]
disable_error_code = name-defined, union-attr

[mypy-bot.feature.business.data.datasource.UserRemoteDataSource]
disable_error_code = arg-type, assignment

[mypy-bot.feature.business.data.repository.ChatHistoryRepositoryImpl]
disable_error_code = arg-type, call-arg

[mypy-bot.feature.business.domain.model.UserModel]
disable_error_code = return-value

[mypy-bot.feature.business.domain.usecase.GetInactiveChatListUseCase]
disable_error_code = operator

[mypy-bot.feature.business.entrypoint.SaveMessageModelMapper]
disable_error_code = arg-type, call-arg

[mypy-bot.feature.business.entrypoint.service.ReminderService]
disable_error_code = arg-type, union-attr

[mypy-bot.feature.admin.entrypoint.filter.IsAdminUserFilter]
disable_error_code = union-attr

[mypy-bot.feature.admin.entrypoint.handler.admin_handlers]
disable_error_code = union-attr

[mypy-bot.feature.business.data.repository.DeepseekRepository]
disable_error_code = return-value

[mypy-bot.feature.business.di.ReminderServiceProvider]
disable_error_code = arg-type, assignment

[mypy-bot.feature.business.domain.usecase.SendAiRequestUseCase]
disable_error_code = call-arg

[mypy-bot.feature.business.domain.util.datetime_util]
disable_error_code = call-arg

[mypy-bot.feature.business.entrypoint.business_message_handlers]
disable_error_code = arg-type, union-attr

[mypy-bot.feature.business.entrypoint.service.ChatService]
disable_error_code = arg-type, union-attr
