# Только конфигурация инструментов. Проект не пакуется.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["scratch", ".idea", "infra"]

[tool.ruff.lint]
# Только ограждающие правила (S0, AT-90). Форматирование НЕ проверяем и ruff format не запускаем:
# по python-code-style каждый параметр на отдельной строке при более чем одном аргументе.
# RUF100: ненужная пометка noqa - ошибка (исправил нарушение - убери и пометку).
# (число исключений держит test/architecture/RuffBaselineTest.py, рост - scripts/baseline_ratchet.py).
select = ["PLR0913", "C901", "TID251", "RUF100"]
# Пометки других линтеров (IDE): RUF100 их не трогает. E402 - импорты после настройки окружения в тестах
external = ["E402", "F401"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Блокирует event loop бота: используйте await asyncio.sleep."
"requests".msg = "Синхронный HTTP блокирует event loop: используйте aiohttp/httpx или клиент SDK."

[tool.ruff.lint.per-file-ignores]
# BASELINE: существующие нарушения. Только сокращать, новые не добавлять.
"bot/feature/business/data/datasource/UserRemoteDataSource.py" = ["TID251"]
"bot/feature/business/data/repository/ChatHistoryRepositoryImpl.py" = ["TID251"]
"bot/feature/business/domain/usecase/SendAiRequestUseCase.py" = ["PLR0913"]
"bot/feature/business/entry/service/ReminderService.py" = ["PLR0913"]
